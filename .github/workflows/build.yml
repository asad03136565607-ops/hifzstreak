name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o hifzstreak.zip || true
      - run: |
          if [ -d hifzstreak/hifzstreak ]; then
            mv hifzstreak/hifzstreak /tmp/h
            rm -rf hifzstreak
            mv /tmp/h hifzstreak
          fi
          if [ -f hifzstreak/package.json ]; then
            cp -a hifzstreak/. $PWD
            rm -rf hifzstreak
          fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
